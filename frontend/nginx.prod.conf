resolver 127.0.0.11 valid=10s;  # Docker internal DNS

server {
    listen 80;
    server_name localhost docker _;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Root directory for static files (production build)
    root /usr/share/nginx/html;
    index index.html;

    # Maintenance Page configuration
    error_page 502 503 504 /maintenance/index.html;
    
    location /maintenance/ {
        alias /usr/share/nginx/maintenance/;
        internal;
    }

    location = /maintenance/index.html {
        alias /usr/share/nginx/maintenance/index.html;
    }

    # IAP identity token passthrough for WebSocket auth
    location = /_gcp_iap/identityToken {
        if ($http_x_goog_iap_jwt_assertion = "") {
            return 404;
        }
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "$http_x_goog_iap_jwt_assertion";
    }

    # API proxy
    location /api/ {
        proxy_pass http://go-api-prod:8080;
        rewrite ^/api/(.*) /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable intercepting errors to show maintenance page
        proxy_intercept_errors on;
    }

    # WebSocket proxy (app logic)
    location /ws {
        proxy_pass http://go-api-prod:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # SPA support: serve static files, fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
