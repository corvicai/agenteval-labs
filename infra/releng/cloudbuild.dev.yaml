steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    script: bash infra/releng/tag-release-images-gcp.sh $(cat infra/releng/release-tag.txt) agenteval-runner agenteval-api agenteval-web
  - name: gcr.io/cloud-builders/docker
    script: |
      # Wait for image to be built by infra/*/cloudbuild.yaml pipelines
      while true; do
        success=0
        for service in agenteval-runner agenteval-api agenteval-web; do
          if docker pull ${_IMAGE_REPO_BASE}/${service}:${COMMIT_SHA}; then
            success=$((success + 1))
        done

        if ((success >= 3)); then
          break
        fi
        echo "Waiting for images to be built..."
      done
    timeout: 300s

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: 'deploy-backend'
    script: |
      #!/usr/bin/env bash
      set -eu -o pipefail
      
      # Deploy runner first
      echo "Deploying runner..."
      gcloud run deploy agenteval-runner-dev --image ${_IMAGE_REPO_BASE}/agenteval-runner:${COMMIT_SHA} --region ${_DEPLOY_REGION} --quiet

      echo "Deploying api..."
      gcloud run deploy agenteval-api-dev --image ${_IMAGE_REPO_BASE}/agenteval-api:${COMMIT_SHA} --region ${_DEPLOY_REGION} --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: 'deploy-frontend'
    script: |
      #!/usr/bin/env bash
      set -eu -o pipefail

      echo "Deploying web..."
      gcloud run deploy agenteval-web-dev --image ${_IMAGE_REPO_BASE}/agenteval-web:${COMMIT_SHA} --region ${_DEPLOY_REGION} --quiet

options:
  automapSubstitutions: true
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
