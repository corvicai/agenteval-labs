---
steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: 'deploy-backend'
    script: |
      #!/usr/bin/env bash
      set -eu -o pipefail
      RELEASE_TAG=$(cat infra/releng/release-tag.txt)
      
      # Deploy runner first
      echo "Deploying runner..."
      gcloud run deploy agenteval-runner-prod --image ${_IMAGE_REPO_BASE}/agenteval-runner:release-${RELEASE_TAG} --region ${_DEPLOY_REGION} --quiet

      echo "Deploying api..."
      gcloud run deploy agenteval-api-prod --image ${_IMAGE_REPO_BASE}/agenteval-api:release-${RELEASE_TAG} --region ${_DEPLOY_REGION} --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: 'deploy-frontend'
    script: |
      #!/usr/bin/env bash
      set -eu -o pipefail
      RELEASE_TAG=$(cat infra/releng/release-tag.txt)
      
      echo "Deploying web..."
      gcloud run deploy agenteval-web-prod --image ${_IMAGE_REPO_BASE}/agenteval-web:release-${RELEASE_TAG} --region ${_DEPLOY_REGION} --quiet

options:
  automapSubstitutions: true
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
