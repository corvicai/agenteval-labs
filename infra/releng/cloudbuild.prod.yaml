---
steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: 'deploy-backend'
    script: |
      #!/usr/bin/env bash
      set -eu -o pipefail
      RELEASE_TAG=$(cat infra/releng/release-tag.txt)

      PROD_ENCRYPTION_ARG=""
      if [ -n "${_ENCRYPTION_KEY_PROD:-}" ]; then
        if [ "${#_ENCRYPTION_KEY_PROD}" -ne 32 ]; then
          echo "ERROR: _ENCRYPTION_KEY_PROD must be 32 chars (got ${#_ENCRYPTION_KEY_PROD})."
          exit 1
        fi
        PROD_ENCRYPTION_ARG="--update-env-vars ENCRYPTION_KEY=${_ENCRYPTION_KEY_PROD}"
      else
        echo "INFO: _ENCRYPTION_KEY_PROD not provided; deploying without changing ENCRYPTION_KEY."
      fi
      
      # Deploy runner first
      echo "Deploying runner..."
      gcloud run deploy agenteval-runner-prod --image ${_IMAGE_REPO_BASE}/agenteval-runner:release-${RELEASE_TAG} --region ${_DEPLOY_REGION} --quiet

      echo "Deploying api..."
      gcloud run deploy agenteval-api-prod ${PROD_ENCRYPTION_ARG} \
        --image ${_IMAGE_REPO_BASE}/agenteval-api:release-${RELEASE_TAG} \
        --region ${_DEPLOY_REGION} \
        --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: 'deploy-frontend'
    script: |
      #!/usr/bin/env bash
      set -eu -o pipefail
      RELEASE_TAG=$(cat infra/releng/release-tag.txt)
      
      echo "Deploying web..."
      gcloud run deploy agenteval-web-prod \
        --image ${_IMAGE_REPO_BASE}/agenteval-web:release-${RELEASE_TAG} \
        --region ${_DEPLOY_REGION} \
        --quiet \
        --update-env-vars VITE_AFK_TIMEOUT_MS=180000

options:
  automapSubstitutions: true
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
