---
steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    script: |
      #!/usr/bin/env bash
      set -eu -o pipefail

      RELEASE_TAG=$(cat infra/releng/release-tag.txt)

      for service in agenteval-api agenteval-runner agenteval-web; do
        gcloud run deploy ${service}-prod --image ${_IMAGE_REPO_BASE}/${service}:${RELEASE_TAG} --region ${_DEPLOY_REGION}
      done
    timeout: 480s
options:
  automapSubstitutions: true
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
