# Hands-free Dependabot: arm GitHub auto-merge on dependabot[bot] PRs so they
# merge once branch protection is satisfied (a human approval + any required
# checks). No `@dependabot merge` comment needed.
#
# NOTE: this repo is PUBLIC and its Cloud Build triggers are comment-gated
# (COMMENTS_ENABLED_FOR_EXTERNAL_CONTRIBUTORS_ONLY) to protect against untrusted
# fork PRs. Cloud Build only honors `/gcbrun` from a human member -- a bot's
# comment is ignored -- so a reviewer still types `/gcbrun` on Dependabot PRs
# here to run the build. Private repos (the vast majority) have no such gate.
name: Dependabot auto
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  dependabot-auto:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Arm auto-merge
        run: gh pr merge "$PR_URL" --auto --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
