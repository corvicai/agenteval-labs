# Pilot: hands-free Dependabot on this repo.
# For dependabot[bot] PRs, (1) post `/gcbrun` to kick the comment-gated Cloud
# Build triggers (this repo is public, so the triggers stay
# COMMENTS_ENABLED_FOR_EXTERNAL_CONTRIBUTORS_ONLY and real fork PRs still need a
# human /gcbrun), and (2) arm GitHub auto-merge so the PR merges once branch
# protection is satisfied (i.e. once a human approves + required checks pass).
name: Dependabot auto
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  dependabot-auto:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloud Build (comment-gated)
        if: ${{ github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize' }}
        run: gh pr comment "$PR_URL" --body "/gcbrun"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Arm auto-merge
        run: gh pr merge "$PR_URL" --auto --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
