name: benchmarking-proxy-prod
services:
  nginx:
    image: nginx:alpine
    container_name: benchmarking-nginx-prod
    volumes:
      # Production config serves static files
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount the production build
      - ./frontend/dist:/usr/share/nginx/html:ro
      # Maintenance page
      - ./maintenance:/usr/share/nginx/maintenance:ro
    ports:
      - "80:80"
    networks:
      benchmarking-public:
        aliases:
          - docker
          - go-api
    restart: unless-stopped

networks:
  benchmarking-public:
    external: true
