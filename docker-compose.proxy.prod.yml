name: benchmarking-proxy
services:
  nginx:
    image: nginx:alpine
    container_name: benchmarking-nginx
    volumes:
      # Production config serves static files
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount the production build
      - ./frontend/dist:/usr/share/nginx/html:ro
      # Maintenance page
      - ./maintenance:/usr/share/nginx/html/maintenance:ro
    ports:
      - "3010:3010"
    networks:
      benchmarking-public:
        aliases:
          - docker
    restart: unless-stopped

networks:
  benchmarking-public:
    external: true
