name: benchmarking-proxy-prod
services:
  nginx:
    image: nginx:alpine
    container_name: benchmarking-nginx-prod
    volumes:
      # Production config serves static files
      - ./ops/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTP Basic Auth credentials for production access gate
      - ./ops/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      # Local-only host map to scope Basic Auth domains
      - ./ops/nginx/.basic-auth-hosts.map:/etc/nginx/basic-auth-hosts.map:ro
      # Mount the production build
      - ./frontend/dist:/usr/share/nginx/html:ro
      # Maintenance page
      - ./maintenance:/usr/share/nginx/maintenance:ro
    ports:
      - "80:80"
    networks:
      benchmarking-public:
        aliases:
          - docker
          - go-api
    restart: unless-stopped

networks:
  benchmarking-public:
    external: true
