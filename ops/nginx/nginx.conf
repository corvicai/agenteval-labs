resolver 127.0.0.11 valid=10s;  # Docker internal DNS

map $host $basic_auth_realm {
    default off;
    include /etc/nginx/basic-auth-hosts.map;
}

server {
    listen 80;
    listen 3010;
    server_name localhost docker _;
    port_in_redirect off;
    absolute_redirect off;
    set $frontend_upstream "http://frontend-dev:3010";
    set $api_upstream "http://go-api:8080";

    # Basic access gate for configured hosts (shared with production proxy).
    auth_basic $basic_auth_realm;
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Maintenance Page configuration
    error_page 502 503 504 /maintenance/index.html;
    
    location /maintenance/ {
        alias /usr/share/nginx/html/maintenance/;
        internal;
    }

    location = /maintenance/index.html {
        alias /usr/share/nginx/html/maintenance/index.html;
    }

    # IAP identity token passthrough for WebSocket auth
    location = /_gcp_iap/identityToken {
        if ($http_x_goog_iap_jwt_assertion = "") {
            return 404;
        }
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "$http_x_goog_iap_jwt_assertion";
    }

    # Vite Dev Server Proxy (for HMR and direct access)
    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable intercepting errors to show maintenance page
        proxy_intercept_errors on;
    }

    # API proxy
    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass $api_upstream;
        rewrite ^/api/(.*) /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable intercepting errors to show maintenance page
        proxy_intercept_errors on;
    }

    # WebSocket proxy (app logic)
    location /ws {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400;
    }
}
